<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Knowledge Graph | Stock Insights</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        .artifact-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            background: #000000;
            overflow: hidden;
        }

        #graph-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .artifact-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            z-index: 10;
        }

        .artifact-info h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .artifact-info p {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        @media (max-width: 768px) {
            .artifact-info {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 12px 16px;
            }

            .artifact-info h2 {
                font-size: 14px;
            }

            .artifact-info p {
                font-size: 11px;
            }

            .controls {
                bottom: 10px;
                padding: 10px 16px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-header">
        <div class="mobile-logo">Stock Insights</div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="site-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="logo-section">
                <a href="../index.html" class="site-logo">Stock Insights</a>
                <p class="site-tagline">전문 주식 분석</p>
            </div>
            <nav class="sidebar-nav">
                <h3 class="nav-title">메뉴</h3>
                <ul class="nav-list">
                    <li><a href="../index.html" class="nav-link">홈</a></li>
                    <li><a href="../index.html#latest" class="nav-link">최신 분석</a></li>
                    <li><a href="index.html" class="nav-link active">Artifact Gallery</a></li>
                </ul>
            </nav>
        </aside>

        <div class="main-content-wrapper" style="padding: 0;">
            <div class="artifact-container">
                <canvas id="graph-canvas"></canvas>

                <div class="artifact-info">
                    <h2>3D Knowledge Graph</h2>
                    <p>
                        인터랙티브 지식 그래프입니다. 드래그하여 회전하고
                        핀치/스크롤로 줌을 조절할 수 있습니다.
                    </p>
                </div>

                <div class="controls">
                    드래그: 회전 | 스크롤/핀치: 줌
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const canvas = document.getElementById('graph-canvas');
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create nodes and connections
        const nodes = [];
        const connections = [];
        const nodeGeometry = new THREE.SphereGeometry(0.3, 16, 16);

        // Node categories with colors
        const categories = [
            { name: 'Tech', color: 0x3498db, count: 8 },
            { name: 'Finance', color: 0xe74c3c, count: 6 },
            { name: 'Research', color: 0x2ecc71, count: 7 },
            { name: 'Market', color: 0xf39c12, count: 6 }
        ];

        // Create nodes in a 3D space
        let nodeIndex = 0;
        categories.forEach((category, catIndex) => {
            for (let i = 0; i < category.count; i++) {
                const nodeMaterial = new THREE.MeshPhongMaterial({
                    color: category.color,
                    emissive: category.color,
                    emissiveIntensity: 0.3
                });

                const node = new THREE.Mesh(nodeGeometry, nodeMaterial);

                // Position nodes in a spiral pattern
                const angle = (nodeIndex / 27) * Math.PI * 4;
                const radius = 5 + Math.sin(nodeIndex * 0.5) * 2;
                const height = (nodeIndex / 27) * 10 - 5;

                node.position.x = Math.cos(angle) * radius;
                node.position.y = height;
                node.position.z = Math.sin(angle) * radius;

                node.userData = {
                    category: category.name,
                    originalY: height,
                    phase: Math.random() * Math.PI * 2
                };

                scene.add(node);
                nodes.push(node);
                nodeIndex++;
            }
        });

        // Create connections between nearby nodes
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                const distance = nodes[i].position.distanceTo(nodes[j].position);

                if (distance < 5 && Math.random() > 0.6) {
                    const points = [nodes[i].position, nodes[j].position];
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({
                        color: 0x444444,
                        transparent: true,
                        opacity: 0.3
                    });
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                    connections.push({ line, nodeA: nodes[i], nodeB: nodes[j] });
                }
            }
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0xffffff, 1, 100);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xffffff, 0.5, 100);
        pointLight2.position.set(-10, -10, -10);
        scene.add(pointLight2);

        camera.position.z = 15;
        camera.position.y = 2;

        // Mouse/Touch interaction
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartDistance = 0;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;

                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const delta = distance - touchStartDistance;

                camera.position.z -= delta * 0.02;
                camera.position.z = Math.max(8, Math.min(30, camera.position.z));

                touchStartDistance = distance;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Zoom with mouse wheel
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(8, Math.min(30, camera.position.z));
        }, { passive: false });

        // Animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Smooth rotation
            rotation.x += (targetRotation.x - rotation.x) * 0.1;
            rotation.y += (targetRotation.y - rotation.y) * 0.1;

            // Apply rotation to all nodes
            nodes.forEach((node, index) => {
                const temp = new THREE.Vector3().copy(node.position);

                // Rotate around Y axis
                const cosY = Math.cos(rotation.y * 0.1);
                const sinY = Math.sin(rotation.y * 0.1);
                const x = temp.x * cosY - temp.z * sinY;
                const z = temp.x * sinY + temp.z * cosY;

                // Subtle floating animation
                node.position.y = node.userData.originalY + Math.sin(time + node.userData.phase) * 0.3;

                // Pulse effect
                const scale = 1 + Math.sin(time * 2 + node.userData.phase) * 0.1;
                node.scale.set(scale, scale, scale);
            });

            // Update connections
            connections.forEach(conn => {
                const points = [conn.nodeA.position, conn.nodeB.position];
                conn.line.geometry.setFromPoints(points);
            });

            // Auto-rotate when not dragging
            if (!isDragging) {
                targetRotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        });

        animate();
    </script>
</body>
</html>
