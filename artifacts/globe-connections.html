<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe Network | Stock Insights</title>
    <link rel="stylesheet" href="../styles/main.css">
    <style>
        .artifact-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            background: radial-gradient(circle at center, #0f0f23 0%, #000000 100%);
            overflow: hidden;
        }

        #globe-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .artifact-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            z-index: 10;
        }

        .artifact-info h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .artifact-info p {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
        }

        .legend {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 11px;
            z-index: 10;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        @media (max-width: 768px) {
            .artifact-info {
                top: 10px;
                left: 10px;
                right: 10px;
                max-width: none;
                padding: 12px 16px;
            }

            .legend {
                bottom: 60px;
                right: 10px;
                font-size: 10px;
            }

            .artifact-info h2 {
                font-size: 14px;
            }

            .artifact-info p {
                font-size: 11px;
            }

            .controls {
                bottom: 10px;
                padding: 10px 16px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-header">
        <div class="mobile-logo">Stock Insights</div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="site-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="logo-section">
                <a href="../index.html" class="site-logo">Stock Insights</a>
                <p class="site-tagline">전문 주식 분석</p>
            </div>
            <nav class="sidebar-nav">
                <h3 class="nav-title">메뉴</h3>
                <ul class="nav-list">
                    <li><a href="../index.html" class="nav-link">홈</a></li>
                    <li><a href="../index.html#latest" class="nav-link">최신 분석</a></li>
                    <li><a href="index.html" class="nav-link active">Artifact Gallery</a></li>
                </ul>
            </nav>
        </aside>

        <div class="main-content-wrapper" style="padding: 0;">
            <div class="artifact-container">
                <canvas id="globe-canvas"></canvas>

                <div class="artifact-info">
                    <h2>3D Globe Network</h2>
                    <p>
                        글로벌 연결 네트워크를 시각화한 3D 지구본입니다.
                        주요 도시 간의 데이터 흐름과 연결을 보여줍니다.
                    </p>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #3498db;"></div>
                        <span>Tech Hub</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #e74c3c;"></div>
                        <span>Finance Center</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #2ecc71;"></div>
                        <span>Data Center</span>
                    </div>
                </div>

                <div class="controls">
                    드래그: 회전 | 스크롤/핀치: 줌
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();

        const canvas = document.getElementById('globe-canvas');
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight - 60);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create globe
        const globeGeometry = new THREE.SphereGeometry(5, 64, 64);
        const globeMaterial = new THREE.MeshPhongMaterial({
            color: 0x1a1a2e,
            emissive: 0x0a0a0f,
            shininess: 10,
            transparent: true,
            opacity: 0.9,
            wireframe: false
        });

        const globe = new THREE.Mesh(globeGeometry, globeMaterial);
        scene.add(globe);

        // Add wireframe overlay
        const wireframeGeometry = new THREE.SphereGeometry(5.01, 32, 32);
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x2a2a3e,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const wireframe = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
        scene.add(wireframe);

        // City locations (lat, lon)
        const cities = [
            { name: 'San Francisco', lat: 37.7749, lon: -122.4194, type: 'tech', color: 0x3498db },
            { name: 'New York', lat: 40.7128, lon: -74.0060, type: 'finance', color: 0xe74c3c },
            { name: 'London', lat: 51.5074, lon: -0.1278, type: 'finance', color: 0xe74c3c },
            { name: 'Tokyo', lat: 35.6762, lon: 139.6503, type: 'tech', color: 0x3498db },
            { name: 'Singapore', lat: 1.3521, lon: 103.8198, type: 'finance', color: 0xe74c3c },
            { name: 'Seoul', lat: 37.5665, lon: 126.9780, type: 'tech', color: 0x3498db },
            { name: 'Hong Kong', lat: 22.3193, lon: 114.1694, type: 'finance', color: 0xe74c3c },
            { name: 'Frankfurt', lat: 50.1109, lon: 8.6821, type: 'data', color: 0x2ecc71 },
            { name: 'Sydney', lat: -33.8688, lon: 151.2093, type: 'data', color: 0x2ecc71 },
            { name: 'Toronto', lat: 43.6532, lon: -79.3832, type: 'tech', color: 0x3498db },
            { name: 'São Paulo', lat: -23.5505, lon: -46.6333, type: 'data', color: 0x2ecc71 },
            { name: 'Mumbai', lat: 19.0760, lon: 72.8777, type: 'tech', color: 0x3498db },
            { name: 'Dubai', lat: 25.2048, lon: 55.2708, type: 'finance', color: 0xe74c3c },
            { name: 'Amsterdam', lat: 52.3676, lon: 4.9041, type: 'data', color: 0x2ecc71 },
            { name: 'Shanghai', lat: 31.2304, lon: 121.4737, type: 'finance', color: 0xe74c3c }
        ];

        // Convert lat/lon to 3D coordinates
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        // Create city markers
        const cityMarkers = [];
        cities.forEach(city => {
            const position = latLonToVector3(city.lat, city.lon, 5.1);

            const markerGeometry = new THREE.SphereGeometry(0.08, 16, 16);
            const markerMaterial = new THREE.MeshBasicMaterial({
                color: city.color,
                transparent: true,
                opacity: 0.9
            });

            const marker = new THREE.Mesh(markerGeometry, markerMaterial);
            marker.position.copy(position);

            // Add glow
            const glowGeometry = new THREE.SphereGeometry(0.15, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: city.color,
                transparent: true,
                opacity: 0.3
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            glow.position.copy(position);

            scene.add(marker);
            scene.add(glow);

            cityMarkers.push({ marker, glow, position, city });
        });

        // Create connections
        const connections = [];
        for (let i = 0; i < cities.length; i++) {
            for (let j = i + 1; j < cities.length; j++) {
                if (Math.random() > 0.7) { // 30% connection probability
                    const start = latLonToVector3(cities[i].lat, cities[i].lon, 5.1);
                    const end = latLonToVector3(cities[j].lat, cities[j].lon, 5.1);

                    // Create curved line
                    const curve = new THREE.QuadraticBezierCurve3(
                        start,
                        start.clone().lerp(end, 0.5).multiplyScalar(1.3),
                        end
                    );

                    const points = curve.getPoints(50);
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({
                        color: 0x4488ff,
                        transparent: true,
                        opacity: 0.2,
                        blending: THREE.AdditiveBlending
                    });

                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                    connections.push({ line, curve, progress: Math.random() });
                }
            }
        });

        // Create traveling particles on connections
        const particles = [];
        connections.forEach(conn => {
            const particleGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const particleMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            const particle = new THREE.Mesh(particleGeometry, particleMaterial);
            scene.add(particle);
            particles.push({ mesh: particle, connection: conn, progress: Math.random() });
        });

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x4488ff, 2, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x8844ff, 1, 50);
        pointLight2.position.set(-10, -5, -10);
        scene.add(pointLight2);

        camera.position.z = 15;

        // Mouse/Touch interaction
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch support
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartDistance = 0;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;

                targetRotation.y += deltaX * 0.005;
                targetRotation.x += deltaY * 0.005;
                targetRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotation.x));

                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const delta = distance - touchStartDistance;

                camera.position.z -= delta * 0.02;
                camera.position.z = Math.max(8, Math.min(25, camera.position.z));

                touchStartDistance = distance;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(8, Math.min(25, camera.position.z));
        }, { passive: false });

        // Animation
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Smooth rotation
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;

            globe.rotation.x = currentRotation.x;
            globe.rotation.y = currentRotation.y;
            wireframe.rotation.x = currentRotation.x;
            wireframe.rotation.y = currentRotation.y;

            // Rotate city markers and connections with globe
            cityMarkers.forEach(item => {
                const rotated = item.position.clone();
                rotated.applyEuler(new THREE.Euler(currentRotation.x, currentRotation.y, 0));
                item.marker.position.copy(rotated);
                item.glow.position.copy(rotated);

                // Pulse effect
                const scale = 1 + Math.sin(time * 2 + item.marker.position.x) * 0.2;
                item.marker.scale.set(scale, scale, scale);
                item.glow.scale.set(scale * 1.5, scale * 1.5, scale * 1.5);
            });

            // Update connections
            connections.forEach(conn => {
                const line = conn.line;
                line.rotation.x = currentRotation.x;
                line.rotation.y = currentRotation.y;
            });

            // Animate particles along connections
            particles.forEach(p => {
                p.progress += 0.005;
                if (p.progress > 1) p.progress = 0;

                const point = p.connection.curve.getPoint(p.progress);
                const rotated = point.clone();
                rotated.applyEuler(new THREE.Euler(currentRotation.x, currentRotation.y, 0));
                p.mesh.position.copy(rotated);
            });

            // Auto-rotate when not dragging
            if (!isDragging) {
                targetRotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight - 60);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
        });

        animate();
    </script>
</body>
</html>
